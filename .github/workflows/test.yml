name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: nvim ${{ matrix.nvim }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # v0.11.0 is the oldest supported version (see the README). When it becomes
        # v0.13.0 or later, delete the code under `raw_wrap` in lua/mdrender/init.lua
        # and the cases under `old_wrap` in test/spec_math.lua (#6).
        nvim: [v0.11.0, stable, nightly]
    # Nightly breakage is reported in the job but does not block a merge.
    continue-on-error: ${{ matrix.nvim == 'nightly' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install the math renderer
        run: npm ci --no-audit --no-fund
        working-directory: node

      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - run: nvim --version

      - name: Run the tests
        run: ./test/run.sh
